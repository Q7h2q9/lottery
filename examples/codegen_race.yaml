# Generic demo: 30 agents race to write a passing implementation. The first
# whose run produces a green test file wins.
id: codegen-leetcode
name: Codegen race - first passing implementation wins
description: |
  CTF is just one shape this framework handles. Here the goal is plain
  software work: write a function and pass the tests. The first agent
  whose output line ends with TESTS_PASS wins.

prompt: |
  You are coder {{ draw_id }} ({{ model }}), competing with {{ count }}
  siblings to be the first to land a passing solution.

  Task: implement `merge_intervals(intervals: list[tuple[int, int]])` in
  `solution.py`, then run `pytest -q` against `test_solution.py`. As soon
  as pytest reports `1 passed`, print exactly:
      TESTS_PASS

  No explanation, no preamble — speed matters.

default_success_criteria:
  - kind: output_contains
    value: "TESTS_PASS"

cancel_policy: delay
cancel_delay_seconds: 15      # give a 15s grace window for a second corroborating winner

concurrency: 15
retries: 1
retry_backoff_seconds: 3
timeout_seconds: 900
working_dir: ./challenges/codegen-leetcode

fleet:
  - model: openai/gpt-5-codex
    count: 20
    tools: read_write
  - model: anthropic/claude-sonnet-4-6
    count: 8
    tools: read_write
  - model: anthropic/claude-opus-4-7:high
    count: 2
    tools: read_write
